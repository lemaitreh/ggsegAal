on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    uses: ggsegverse/.github/.github/workflows/pkgdown.yaml@main
    with:
      extra-packages: |
        ggsegverse/ggseg.formats
        any::pkgdown
        any::quarto
        local::.
